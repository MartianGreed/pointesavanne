services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pointesavanne
      POSTGRES_PASSWORD: pointesavanne
      POSTGRES_DB: pointesavanne
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pointesavanne"]
      interval: 5s
      timeout: 3s
      retries: 10
