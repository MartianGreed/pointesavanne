name: Checks

on:
  push:
  pull_request:

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pointesavanne
          POSTGRES_PASSWORD: pointesavanne
          POSTGRES_DB: pointesavanne
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pointesavanne"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pointesavanne:pointesavanne@localhost:5432/pointesavanne
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit + HTTP tests (in-memory and sqlite doubles)
        run: bun run test
      - name: Domain use cases (BDD feature suite, @structure-ai/bdd on bun test)
        run: bun run test:features
      - name: Domain stores over real PostgreSQL (migrations, event store, projections, auth)
        run: bun test test/pg.test.ts
        working-directory: apps/api
      - name: Build
        run: bun run build
